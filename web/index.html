<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Axis Bank Assistant — POC</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2397144D'/><text y='72' x='50' text-anchor='middle' font-size='64' font-family='sans-serif' font-weight='700' fill='white'>A</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark" id="logo-mark">A</div>
    <div>
      <div class="brand-name" id="logo-text">AXIS BANK</div>
      <div class="brand-sub" id="product-name">Assistant</div>
    </div>
  </div>

  <div class="topbar-controls">
    <nav class="pagenav">
      <a href="/" class="on">Assistant</a>
      <a href="/assist">Agent assist</a>
    </nav>
    <label class="ctl">
      <span>Customer</span>
      <select id="customer-select"></select>
    </label>
    <div class="ctl static">
      <span>Model</span>
      <code id="model-name">—</code>
    </div>
    <div class="ctl static">
      <span>Tools</span>
      <code id="tool-count">—</code>
    </div>
    <label class="ctl">
      <span>Voice</span>
      <select id="voice-lang" title="Speech language for both the mic and the spoken reply"></select>
    </label>
    <button id="btn-handsfree" class="btn ghost" title="Keep the mic open between turns — a full spoken conversation">Hands-free</button>
    <button id="btn-panel" class="btn ghost" title="Show/hide the bank systems panel (Ctrl+B)">Hide panel</button>
    <button id="btn-tools" class="btn ghost" title="List every tool the agent has">Tools</button>
    <button id="btn-new" class="btn ghost" title="Clear the conversation, keep the banking state">New chat</button>
    <button id="btn-reload" class="btn" title="Re-read config/, re-scan tools, rebuild the agent">Reload config</button>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------------------------------------------ -->
  <section class="chat-col">
    <div class="phone">
      <div class="phone-head">
        <div class="avatar" id="avatar-mark">A</div>
        <div class="phone-head-text">
          <div class="phone-title" id="chat-title">Axis Bank Assistant</div>
          <div class="phone-sub"><span class="dot"></span><span id="chat-sub">Online · Secure session</span></div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="chips" id="chips"></div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" id="mic" class="mic" aria-label="Speak" title="Speak (Ctrl+M)">
          <svg class="ico-mic" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
          <svg class="ico-stop" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 7h10v10H7z"/></svg>
        </button>
        <input id="input" placeholder="Type your message…" autocomplete="off" />
        <button type="submit" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </form>
      <div class="disclaimer" id="disclaimer"></div>
    </div>
  </section>

  <!-- ------------------------------------------------------------------ -->
  <section class="panel-col">
    <div class="panel-tabs">
      <button class="tab active" data-tab="state">Bank systems</button>
      <button class="tab" data-tab="trace">Agent trace</button>
      <button class="tab-collapse" id="btn-collapse" title="Hide panel (Ctrl+B)" aria-label="Hide panel">›</button>
    </div>

    <div class="panel-body" id="tab-state">
      <div id="state-content" class="state-content"><div class="empty">Loading…</div></div>
    </div>

    <div class="panel-body hidden" id="tab-trace">
      <div class="trace-hint">Every tool the agent calls, live. This is the real ADK function-calling loop — nothing scripted.</div>
      <div id="trace-content" class="trace"><div class="empty">No tool calls yet. Ask something.</div></div>
    </div>
  </section>

</main>

<div class="modal hidden" id="tools-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Agent tools</h2>
      <button class="btn ghost" id="btn-close-tools">Close</button>
    </div>
    <div class="modal-body" id="tools-body"></div>
  </div>
</div>

<script src="/static/voice.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
